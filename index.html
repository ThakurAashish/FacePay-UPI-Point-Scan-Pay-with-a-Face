<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FacePay UPI — Point, Scan & Pay with a Face</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <div class="app-container">
        
        <header>
            <h1>UR</h1>
            <p class="tagline">Your face is the new QR</p>
        </header>

        <div id="glass-panel">
            <div class="camera-wrapper">
                <video id="video" autoplay muted playsinline></video>
            </div>
            
            <div id="controls">
                <button id="scan-btn" disabled>Initializing AI...</button>
            </div>

            <div id="payment-popup" style="display: none;">
                <h2 id="friend-name">Target Locked</h2>
                <div class="button-group">
                    <button id="gpay-btn" class="pay-btn gpay">Google Pay</button>
                    <button id="phonepe-btn" class="pay-btn phonepe">PhonePe</button>
                    <button id="paytm-btn" class="pay-btn paytm">Paytm</button>
                </div>
                <button id="reset-btn" class="pay-btn cancel">Scan Another Face</button>
            </div>
        </div>
        
    </div>
</body>
</html>
